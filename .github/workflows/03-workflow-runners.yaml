name: 03 – Workflow Runners

on:
  #push:
  #pull_request:
  workflow_dispatch:

jobs:
  ubuntu-echo:
    runs-on: lab
    steps:
      - name: Show OS
        run: |
          echo "This job is running on an self-hosted runner."
          echo "OS: $RUNNER_OS"

  windows-echo:
    runs-on: windows-latest
    steps:
      - name: Show OS
        shell: bash
        run: |
          echo "This job is running on a Windows runner."
          echo "OS: $RUNNER_OS"
  
  mac-echo:
    runs-on: macos-latest
    steps:
      - name: Show OS
        run: |
          echo "This job is running on a MacOS runner."
          echo "OS: $RUNNER_OS"
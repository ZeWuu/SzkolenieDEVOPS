# Zastąp 203.0.113.10/32 swoim publicznym adresem IPv4 z maską /32
# lub zaufanym zakresem VPN. To przykładowy adres dokumentacyjny.
inbound_rules:
  - protocol: tcp
    port_range: "22"
    source_addresses:
      - "0.0.0.0/0"

  - protocol: icmp
    source_addresses:
      - "0.0.0.0/0"

  # HTTP z tego samego zakresu szkoleniowego; zmień na 0.0.0.0/0, jeśli strona ma być publiczna.
  - protocol: tcp
    port_range: "80"
    source_addresses:
      - "0.0.0.0/0"

# Ruch wychodzący IPv4: wszystkie porty TCP/UDP oraz ICMP.
outbound_rules:
  - protocol: tcp
    port_range: "1-65535"
    destination_addresses:
      - "0.0.0.0/0"

  - protocol: udp
    port_range: "1-65535"
    destination_addresses:
      - "0.0.0.0/0"

  - protocol: icmp
    destination_addresses:
      - "0.0.0.0/0"
